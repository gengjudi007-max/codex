name: release-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: NewsroomOS-macOS
            binary_path: dist/NewsroomOS
          - os: windows-latest
            artifact_name: NewsroomOS-Windows
            binary_path: dist/NewsroomOS.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[desktop]

      - name: Build desktop executable
        run: |
          pyinstaller --onefile --name NewsroomOS src/codex/desktop_app.py

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cp dist/NewsroomOS release/NewsroomOS
          chmod +x release/NewsroomOS
          cd release
          zip -r NewsroomOS-macOS.zip NewsroomOS

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/NewsroomOS.exe release/NewsroomOS.exe
          Compress-Archive -Path release/NewsroomOS.exe -DestinationPath release/NewsroomOS-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
