<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsroom OS</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f7f9; color: #111827; }
    header { background: #111827; color: white; padding: 20px 28px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 6px 0 0; opacity: .78; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .card h2 { margin: 0 0 10px; font-size: 16px; }
    .status { display: inline-block; padding: 4px 9px; border-radius: 999px; background: #e5e7eb; font-size: 12px; }
    .ok { background: #dcfce7; color: #166534; }
    .warn { background: #fef3c7; color: #92400e; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f9fafb; padding: 12px; border-radius: 8px; max-height: 260px; overflow: auto; }
    button { border: 0; border-radius: 8px; padding: 10px 12px; background: #111827; color: white; cursor: pointer; }
    button:disabled { opacity: .5; }
    .muted { color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Newsroom OS</h1>
    <p>房地产财经战略情报与编辑部运行控制台</p>
  </header>
  <main>
    <div class="grid">
      <section class="card">
        <h2>系统状态</h2>
        <div id="status" class="status">加载中</div>
        <p class="muted" id="updated"></p>
        <button onclick="refreshAll()">刷新</button>
      </section>
      <section class="card">
        <h2>健康检查</h2>
        <pre id="health">加载中...</pre>
      </section>
      <section class="card">
        <h2>控制中心</h2>
        <pre id="control">加载中...</pre>
      </section>
      <section class="card">
        <h2>主编级情报</h2>
        <pre id="executive">加载中...</pre>
      </section>
    </div>
  </main>
  <script>
    async function getJSON(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(path + ' ' + res.status);
      return await res.json();
    }
    function render(id, data) {
      document.getElementById(id).textContent = JSON.stringify(data, null, 2);
    }
    async function refreshAll() {
      const status = document.getElementById('status');
      status.textContent = '刷新中';
      status.className = 'status warn';
      try {
        const [health, control, executive] = await Promise.all([
          getJSON('/health'),
          getJSON('/control-center'),
          getJSON('/executive-intelligence')
        ]);
        render('health', health);
        render('control', control);
        render('executive', executive);
        status.textContent = control.status || health.overall_status || 'ok';
        status.className = 'status ok';
        document.getElementById('updated').textContent = '最后更新：' + new Date().toLocaleString();
      } catch (err) {
        status.textContent = '错误';
        status.className = 'status warn';
        render('health', { error: String(err) });
      }
    }
    refreshAll();
  </script>
</body>
</html>
