[project]
name = "codex"
version = "0.1.0"
description = "Real estate reporting assistant for Chinese financial journalists"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "gengjudi007-max"}
]
dependencies = [
  "pypdf>=4.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

desktop = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
codex = "codex.cli:main"
codex-daily = "codex.main:run_daily_topic_engine"
codex-interactive = "codex.interactive:main"
codex-server = "codex.server:main"
codex-desktop = "codex.desktop_app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/codex"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
